<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적문의 접수완료 | 트러스트하우징</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f9fc;color:#102a43}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:560px;width:100%;background:#fff;border-radius:18px;padding:48px 30px;text-align:center;box-shadow:0 15px 45px rgba(16,42,67,.12)}
.icon{font-size:54px;margin-bottom:14px}
h1{margin:0 0 14px;font-size:32px}
p{color:#627d98;line-height:1.7}
.btn{display:inline-block;margin-top:20px;padding:13px 22px;background:#1769aa;color:#fff;text-decoration:none;border-radius:8px;font-weight:800}
.phone{margin-top:18px;font-size:20px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon">✓</div>
    <h1>견적문의가 접수되었습니다.</h1>
    <p>트러스트하우징에 문의해주셔서 감사합니다.<br>확인 후 빠르게 연락드리겠습니다.</p>
    <div class="phone">02-6338-5431<br>010-2202-5431</div>
    <a class="btn" href="https://trusthousing.co.kr/">홈페이지로 돌아가기</a>
  </div>
</div>
</body>
</html>
